# Postgres for the polling site (branch "postgres").
# Run with: docker compose -f compose.postgres.yaml up -d
# Starts Postgres 16 with user app, password app, database app. The tables are created by the app at startup.
services:
  db:
    image: postgres:16
    container_name: interview-postgres
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 3s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
